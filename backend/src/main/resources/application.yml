server:
  port: 8080

spring:
  application:
    name: campus-transfer
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 按本机 MySQL 实际情况修改账号密码
    url: jdbc:mysql://localhost:3306/campus_transfer?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，正式部署可注释掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:f
# 应用自定义配置
app:
  jwt:
    # 签名密钥（自行修改即可，前后端 token 校验依赖一致），长度建议 32 字符以上
    secret: campus-transfer-2024-secret-key-please-change-me
    # token 有效期（小时），默认 7 天
    expire-hours: 168
  # 密码加盐值，与 sql/init.sql 中管理员密码一致
  salt: campus@2024
  # 图片上传保存目录（相对后端运行目录；也可改为绝对路径）
  upload:
    dir: upload/
